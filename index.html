<script>
/* Capa de sincronización con Google Sheets (vía Apps Script) + caché offline. */
var Sync = (function(){
  var LS = {key:'agt_key', url:'agt_url', state:'agt_state', base:'agt_base'};
  function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
  function lsSet(k,v){ try { localStorage.setItem(k, v); } catch(e){} }
  function lsDel(k){ try { localStorage.removeItem(k); } catch(e){} }

  var cfg = window.AGT_CONFIG || {};
  var status = {text:'', cls:''};
  var inflight = false;
  var base = {};          // id -> firma de la versión conocida en el servidor
  var onStatus = function(){};

  function apiUrl(){
    var u = lsGet(LS.url) || cfg.apiUrl || '';
    return /^https:\/\/script\.google\.com\//.test(u) ? u : '';
  }
  function getKey(){ return lsGet(LS.key) || ''; }
  function configured(){ return !!apiUrl() && !!getKey(); }

  function sig(d){
    var c = {}; Object.keys(d).sort().forEach(function(k){ if (k !== 'updatedAt') c[k] = d[k]; });
    return JSON.stringify(c);
  }
  function baseFrom(list){ var b = {}; list.forEach(function(d){ b[d.id] = sig(d); }); return b; }
  function saveBase(){ lsSet(LS.base, JSON.stringify(base)); }
  function cacheState(deals){ lsSet(LS.state, JSON.stringify(deals)); }
  function loadCache(){
    try { var s = JSON.parse(lsGet(LS.state) || 'null'); if (Array.isArray(s)) return s; } catch(e){}
    return null;
  }
  function loadBase(){ try { base = JSON.parse(lsGet(LS.base) || '{}') || {}; } catch(e){ base = {}; } }

  function setStatus(text, cls){ status = {text:text, cls:cls||''}; onStatus(status); }

  function diff(local, baseMap){
    var up = [], seen = {};
    local.forEach(function(d){ seen[d.id] = true; if (baseMap[d.id] !== sig(d)) up.push(d); });
    var del = Object.keys(baseMap).filter(function(id){ return !seen[id]; });
    return {upserts: up, deletes: del};
  }
  function overlay(server, ed){
    var delSet = {}; ed.deletes.forEach(function(id){ delSet[id] = true; });
    var upMap = {}; ed.upserts.forEach(function(d){ upMap[d.id] = d; });
    var out = server.filter(function(d){ return !delSet[d.id] && !upMap[d.id]; });
    ed.upserts.forEach(function(d){ out.push(d); });
    return out;
  }

  function call(payload){
    var url = apiUrl();
    var p;
    if (payload) {
      payload.key = getKey();
      p = fetch(url, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(payload)});
    } else {
      p = fetch(url + (url.indexOf('?') >= 0 ? '&' : '?') + 'key=' + encodeURIComponent(getKey()) + '&t=' + Date.now());
    }
    return p.then(function(r){ return r.json(); }).then(function(j){
      if (!j || !j.ok) { var e = new Error((j && j.error) || 'error'); e.auth = (j && j.error === 'clave'); throw e; }
      return j.deals;
    });
  }

  function errText(e){
    if (e && e.auth) return 'Clave incorrecta';
    if (typeof navigator !== 'undefined' && navigator.onLine === false) return 'Sin conexión';
    return 'No se pudo sincronizar';
  }

  /* Trae del servidor y combina con cambios locales pendientes. api = {getDeals, setDeals, canApply} */
  function pull(api){
    if (inflight || !configured()) return Promise.resolve();
    inflight = true; setStatus('Sincronizando…','busy');
    var local = api.getDeals();
    var ed = diff(local, base);
    var sent = ed;
    var req = (ed.upserts.length || ed.deletes.length) ? stamp(ed) : null;
    return call(req ? {upserts: ed.upserts, deletes: ed.deletes} : null).then(function(server){
      inflight = false;
      var now = api.getDeals();
      var knownBase = applyEd(base, sent);
      var after = diff(now, knownBase);                 // ediciones hechas mientras volaba
      base = baseFrom(server); saveBase();
      var merged = overlay(server, after);
      if (api.canApply() || after.upserts.length || after.deletes.length) { api.setDeals(merged); }
      cacheState(merged);
      if (after.upserts.length || after.deletes.length) { return pull(api); }
      setStatus('✓ Sincronizado ' + hhmm(), 'ok');
    }).catch(function(e){
      inflight = false;
      cacheState(api.getDeals());
      setStatus(errText(e) + ' · cambios guardados en este celular', 'warn');
      if (e && e.auth) { lsDel(LS.key); }
    });
  }
  function stamp(ed){
    var t = new Date().toISOString();
    ed.upserts.forEach(function(d){ d.updatedAt = t; });
    return ed;
  }
  function applyEd(b, ed){
    var nb = {}; Object.keys(b).forEach(function(k){ nb[k] = b[k]; });
    ed.deletes.forEach(function(id){ delete nb[id]; });
    ed.upserts.forEach(function(d){ nb[d.id] = sig(d); });
    return nb;
  }
  function hhmm(){ var d = new Date(); return ('0'+d.getHours()).slice(-2) + ':' + ('0'+d.getMinutes()).slice(-2); }

  function hasPending(local){ var e = diff(local, base); return e.upserts.length > 0 || e.deletes.length > 0; }

  return {
    configured: configured, apiUrl: apiUrl, getKey: getKey,
    setCredentials: function(url, key){ if (url) lsSet(LS.url, url); lsSet(LS.key, key); },
    logout: function(){ lsDel(LS.key); lsDel(LS.state); lsDel(LS.base); },
    onStatus: function(fn){ onStatus = fn; },
    status: function(){ return status; },
    cached: loadCache, loadBase: loadBase, cacheState: cacheState,
    initialFetch: function(){ return call(null).then(function(list){ base = baseFrom(list); saveBase(); cacheState(list); return list; }); },
    pull: pull, hasPending: hasPending, setStatus: setStatus,
    errText: errText
  };
})();

</script>

  /* ---------- constants ---------- */

  function mesLabel(fecha){

  var state = (window.__STATE__ && Array.isArray(window.__STATE__.deals)) ? window.__STATE__ : {deals:[]};

  /* ---------- helpers ---------- */

  function todayStr(){ var d = new Date(); return d.toISOString().slice(0,10); }
  function nowIso(){ return new Date().toISOString(); }
  function esc(s){
    return String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function fmtMoney(v, cur){
    if (v === '' || v === null || v === undefined || isNaN(Number(v))) return '—';
    return (cur || 'USD') + ' ' + Number(v).toLocaleString('es-AR', {maximumFractionDigits:0});
  }
  function fmtDate(iso){
    if(!iso) return '—';
    var p = iso.split('-');
    if (p.length !== 3) return iso;
    return p[2] + '/' + p[1] + '/' + p[0];
  }
  function fmtDateTime(iso){
    try{
      var d = new Date(iso);
      return d.toLocaleString('es-AR', {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
    }catch(e){ return iso; }
  }
  function byId(id){ return state.deals.find(function(d){ return d.id === id; }); }
  function sumItems(items){
    return (items || []).reduce(function(sum, it){
      var m = Number(it.monto);
      return sum + (isNaN(m) ? 0 : m);
    }, 0);
  }
  var PAGO_FIELDS = ['tradeInValor', 'pagoContado', 'pagoCreditoBanco', 'pagoFinancPropia1er', 'pagoFinancPropiaResto'];

    return PAGO_FIELDS.reduce(function(sum, k){

  }
  function fmtNumber(n){ return Number(n || 0).toLocaleString('es-AR', {maximumFractionDigits:0}); }
  function matchInfo(sum, precio){
    if (precio === '' || precio === null || precio === undefined || isNaN(Number(precio)) || Number(precio) === 0) {
      return {cls:'', html:''};
    }
    var diff = Number(precio) - sum;
    if (Math.abs(diff) < 0.01) return {cls:'ok', html:'✓ Coincide con el precio de venta'};
    return {cls:'warn', html:'⚠ No coincide con el precio de venta (' + (diff > 0 ? 'falta cubrir ' : 'sobra ') + fmtNumber(Math.abs(diff)) + ')'};

  function filteredDeals(){
    var q = ui.search.trim().toLowerCase();
    return state.deals.filter(function(d){
      if (ui.vendedor && d.vendedor !== ui.vendedor) return false;
      if (ui.estado && d.estado !== ui.estado) return false;
      if (ui.condicion && d.condicionUnidad !== ui.condicion) return false;
      if (q) {
        var hay = ((d.cliente||'') + ' ' + (d.unidad||'') + ' ' + (d.vendedor||'')).toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    }).slice().sort(compareDeals);
  }

  function sortValue(d, key){
    if (key === 'precio') { var n = Number(d.precio); return isNaN(n) ? -Infinity : n; }
    if (key === 'estado') return ((STATUS[d.estado] || {}).label || d.estado || '').toLowerCase();
    return String(d[key] || '').toLowerCase();
  }
  function compareDeals(a, b){
    var key = ui.sortKey, dir = ui.sortDir === 'asc' ? 1 : -1;
    var va = sortValue(a, key), vb = sortValue(b, key);
    var r = (typeof va === 'number') ? (va - vb) : String(va).localeCompare(String(vb), 'es', {sensitivity:'base', numeric:true});
    if (r === 0) r = String(a.fecha || '').localeCompare(String(b.fecha || ''));
    return r * dir;
  }
  function sortTh(key, label){
    var active = ui.sortKey === key;
    var arrow = active ? (ui.sortDir === 'asc' ? '▲' : '▼') : '↕';
    return '<th aria-sort="' + (active ? (ui.sortDir === 'asc' ? 'ascending' : 'descending') : 'none') + '">' +
      '<button type="button" class="sort-btn' + (active ? ' active' : '') + '" data-action="sort" data-key="' + key + '">' +
      label + ' <span class="sort-arrow">' + arrow + '</span></button></th>';
  }

  function distinctYears(){

  function distinctMonths(){

  function reportFilteredDeals(){
    return state.deals.filter(function(d){
      if (reportFilters.desde && (d.fecha || '') < reportFilters.desde) return false;
      if (reportFilters.hasta && (d.fecha || '') > reportFilters.hasta) return false;
      if (reportFilters.anios.length && reportFilters.anios.indexOf((d.fecha || '').slice(0,4)) === -1) return false;
      if (reportFilters.meses.length && reportFilters.meses.indexOf(mesKey(d.fecha)) === -1) return false;
      if (reportFilters.vendedores.length && reportFilters.vendedores.indexOf(d.vendedor) === -1) return false;
      if (reportFilters.tipos.length && reportFilters.tipos.indexOf(d.tipoUnidad) === -1) return false;
      if (reportFilters.estados.length && reportFilters.estados.indexOf(d.estado) === -1) return false;
      if (reportFilters.condicion && d.condicionUnidad !== reportFilters.condicion) return false;
      if (reportFilters.cliente) {
        var q = reportFilters.cliente.trim().toLowerCase();
        if (q && (d.cliente || '').toLowerCase().indexOf(q) === -1) return false;

  /* Excel con configuración regional en español (Argentina incluida) espera
   * punto y coma como separador de columnas en un CSV, no coma — así que
   * usamos ';' como delimitador y solo entrecomillamos un campo si contiene
   * ';', comillas o un salto de línea. */
  function csvEscape(v){
    var s = (v === null || v === undefined) ? '' : String(v);
    if (/[";\n]/.test(s)) { s = '"' + s.replace(/"/g, '""') + '"'; }
    return s;
  }

  function numOrBlank(v){ return (v === '' || v === null || v === undefined || isNaN(Number(v))) ? '' : Number(v); }

  function buildReportCsv(deals){
    var headers = ['Mes','Vendedor','Cliente','Condición','Tipo','Unidad','N° NIS','Total','Moneda',
      'Unidad tomada (ingreso)','Valor de toma','Contado','Crédito CNH/Banco','Financ. propia 1er año','Financ. propia resto',
      'Origen','Estado del negocio','Observaciones'];
    var rows = deals.map(function(d){
      return [
        mesLabel(d.fecha), d.vendedor, d.cliente, (CONDICION_UNIDAD[d.condicionUnidad] || '').toUpperCase(),
        (TIPO_UNIDAD[d.tipoUnidad] || '').toUpperCase(), d.unidad, d.condicionUnidad === '0km' ? '' : (d.nis || ''),
        numOrBlank(d.precio), d.moneda,
        d.tradeInModelo || '', numOrBlank(d.tradeInValor),
        numOrBlank(d.pagoContado), numOrBlank(d.pagoCreditoBanco), numOrBlank(d.pagoFinancPropia1er), numOrBlank(d.pagoFinancPropiaResto),
        d.origen || '', (STATUS[d.estado] || {}).label || d.estado, d.notas || ''
      ];
    });
    var sum = function(field){
      return deals.reduce(function(acc, d){ var v = Number(d[field]); return acc + (isNaN(v) ? 0 : v); }, 0);
    };
    var totalRow = ['TOTAL','','','','','','', sum('precio'), '',
      '', sum('tradeInValor'), sum('pagoContado'), sum('pagoCreditoBanco'), sum('pagoFinancPropia1er'), sum('pagoFinancPropiaResto'),
      '', '', ''];
    var lines = [headers.map(csvEscape).join(';')]
      .concat(rows.map(function(r){ return r.map(csvEscape).join(';'); }))
      .concat([totalRow.map(csvEscape).join(';')]);
    return '﻿' + lines.join('\r\n');
  }

  function buildReportExcelHtml(deals){

      ];

  /* ---------- carga masiva desde planilla de vendedores ---------- */
  var SHEET_HEADERS = ['Fecha','Vendedor','Cliente','Condición','Tipo de unidad','Unidad cotizada','N° NIS','N° Boleto','Fecha boleto',
    'Precio','Moneda','Método de financiación','Concepto 1','Monto 1','Concepto 2','Monto 2','Concepto 3','Monto 3',
    'Origen','Unidad tomada (ingreso)','Valor de toma','Contado','Crédito CNH/Banco','Financ. propia 1er año','Financ. propia resto',
    'Estado','Notas'];

  function buildTemplateCsv(){
    var example = ['24/08/2026','Juan Pérez','Estancia La Elvira','Usada','Tractor','New Holland TL75','2019-4471','1892','21/08/2026',
      '38000','USD','Contado','Efectivo','38000','','','','',

    var lines = [SHEET_HEADERS.map(csvEscape).join(';'), example.map(csvEscape).join(';')];

  function reverseLookup(map, text){
    if (!text) return null;
    var t = String(text).trim().toLowerCase();
    var found = null;
    Object.keys(map).forEach(function(k){
      var label = (map[k] && typeof map[k] === 'object') ? map[k].label : map[k];
      if (label && String(label).trim().toLowerCase() === t) found = k;
    });
    return found;
  }

  function parseFechaPlanilla(s){
    if (!s) return '';
    s = String(s).trim();
    var m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if (m) {
      var dd = m[1].length < 2 ? '0' + m[1] : m[1];
      var mm = m[2].length < 2 ? '0' + m[2] : m[2];
      return m[3] + '-' + mm + '-' + dd;
    }
    if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
    return '';
  }

  function parseNumberEsAr(s){
    if (s === undefined || s === null) return NaN;
    s = String(s).trim();
    if (s === '') return NaN;
    s = s.replace(/\./g, '').replace(',', '.');
    return Number(s);
  }

  function detectDelimiter(text){
    var firstLine = text.split(/\r\n|\n/)[0] || '';
    var semis = (firstLine.match(/;/g) || []).length;
    var commas = (firstLine.match(/,/g) || []).length;
    return semis >= commas ? ';' : ',';
  }

  function parseCsvText(text, delimiter){
    var rows = [], row = [], field = '', inQuotes = false;
    var i = 0, len = text.length;
    while (i < len) {
      var c = text[i];
      if (inQuotes) {
        if (c === '"') {
          if (text[i + 1] === '"') { field += '"'; i += 2; continue; }
          inQuotes = false; i++; continue;
        }
        field += c; i++; continue;
      }
      if (c === '"') { inQuotes = true; i++; continue; }
      if (c === delimiter) { row.push(field); field = ''; i++; continue; }
      if (c === '\r') { i++; continue; }
      if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; i++; continue; }
      field += c; i++;
    }
    row.push(field);
    if (row.length > 1 || row[0] !== '') rows.push(row);
    return rows;
  }

  function parseSheetCsv(text){
    var delimiter = detectDelimiter(text);
    var rows = parseCsvText(text, delimiter);
    if (!rows.length) return {headerOk:false, rows:[], errors:['El archivo está vacío.']};
    var header = rows[0].map(function(h){ return String(h || '').trim(); });
    var idx = {};
    SHEET_HEADERS.forEach(function(h){
      idx[h] = header.findIndex(function(hh){ return hh.toLowerCase() === h.toLowerCase(); });
    });
    var missing = SHEET_REQUIRED.filter(function(h){ return idx[h] === -1; });
    if (missing.length) {
      return {headerOk:false, rows:[], errors:['Faltan columnas obligatorias en el encabezado: ' + missing.join(', ') + '. ¿Usaste la plantilla descargada desde el panel?']};
    }
    var dataRows = rows.slice(1).filter(function(r){ return r.some(function(c){ return String(c || '').trim() !== ''; }); });
    var parsed = dataRows.map(function(r, i){
      function get(h){ var p = idx[h]; return p === -1 ? '' : String(r[p] || '').trim(); }
      var errores = [];
      var fecha = parseFechaPlanilla(get('Fecha')) || todayStr();
      var vendedor = get('Vendedor'); if (!vendedor) errores.push('falta vendedor');
      var cliente = get('Cliente'); if (!cliente) errores.push('falta cliente');
      var unidad = get('Unidad cotizada'); if (!unidad) errores.push('falta unidad cotizada');
      var precioRaw = get('Precio');
      var precio = parseNumberEsAr(precioRaw);
      if (precioRaw === '' || isNaN(precio)) errores.push('precio inválido o vacío');
      var financiacion = get('Método de financiación'); if (!financiacion) errores.push('falta método de financiación');
      var moneda = get('Moneda').toUpperCase() === 'ARS' ? 'ARS' : 'USD';
      var tipoUnidad = reverseLookup(TIPO_UNIDAD, get('Tipo de unidad')) || '';
      var condicionUnidad = reverseLookup(CONDICION_UNIDAD, get('Condición')) || '';
      var estado = reverseLookup(STATUS, get('Estado')) || 'en_analisis';
      var items = [];
      [1, 2, 3].forEach(function(n){
        var concepto = get('Concepto ' + n);
        var montoRaw = get('Monto ' + n);
        if (concepto || montoRaw) {
          var monto = montoRaw === '' ? '' : parseNumberEsAr(montoRaw);
          items.push({concepto: concepto, monto: (monto === '' || isNaN(monto)) ? '' : monto});
        }
      });
      function getNum(h){ var raw = get(h); return raw === '' ? '' : (function(){ var n = parseNumberEsAr(raw); return isNaN(n) ? '' : n; })(); }
      var deal = {
        id: uid(), fecha: fecha, vendedor: vendedor, cliente: cliente, unidad: unidad, tipoUnidad: tipoUnidad,
        condicionUnidad: condicionUnidad,
        nis: condicionUnidad === '0km' ? '' : get('N° NIS'), boletoNumero: get('N° Boleto'), boletoFecha: parseFechaPlanilla(get('Fecha boleto')),
        precio: isNaN(precio) ? '' : precio, moneda: moneda, financiacion: get('Método de financiación'),
        condicionesItems: items,
        origen: get('Origen'), tradeInModelo: get('Unidad tomada (ingreso)'), tradeInValor: getNum('Valor de toma'),
        pagoContado: getNum('Contado'), pagoCreditoBanco: getNum('Crédito CNH/Banco'),
        pagoFinancPropia1er: getNum('Financ. propia 1er año'), pagoFinancPropiaResto: getNum('Financ. propia resto'),
        estado: estado, notas: get('Notas'), historial: []
      };
      var dupe = state.deals.some(function(existing){
        return (existing.cliente || '').trim().toLowerCase() === cliente.trim().toLowerCase() &&
               (existing.unidad || '').trim().toLowerCase() === unidad.trim().toLowerCase();
      });
      return {rowNumber: i + 2, deal: deal, errores: errores, dupe: dupe};
    });
    return {headerOk:true, rows: parsed, errors: []};
  }

  function renderToast(){

  function showToast(msg, ms){
    toastMsg = msg;
    render();
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastMsg = null; render(); }, ms || 2600);
  }

  /* ---------- persistence ---------- */
  function persist(){
    render();
    Sync.cacheState(state.deals);
    Sync.pull(syncApi);
  }
  var syncApi = {
    getDeals: function(){ return state.deals; },
    setDeals: function(d){ if (JSON.stringify(d) === JSON.stringify(state.deals)) return; state.deals = d; if (!ui.modal) render(); },
    canApply: function(){
      var ae = document.activeElement;
      var typing = ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName);
      return !ui.modal && !typing;
    }
  };
  function updateSyncChip(){
    var el = document.getElementById('sync-chip');

  function downloadReport(){
    var deals = reportFilteredDeals();
    if (!deals.length) { showToast('No hay negocios que coincidan con estos filtros.'); return; }
    var csv = buildReportCsv(deals);
    var stamp = todayStr();
    var doSave = function(ns, filename){
      return ns.save({filename: filename, data: csv}).then(function(){
        showToast('Informe descargado (' + deals.length + ' negocios).');
        ui.modal = null;
        render();
      });
    };
    if (!downloadsNs) {
      showToast('La descarga de archivos no está disponible en esta vista.', 4000);
      return;
    }
    doSave(downloadsNs, 'negocios_' + stamp + '.csv').catch(function(err){
      var code = err && err.code;
      if (code === 'extension_not_enabled' || code === 'rejected_extension') {
        doSave(downloadsNs, 'negocios_' + stamp + '.txt').catch(function(err2){
          showToast('No se pudo descargar el informe: ' + (err2 && err2.message ? err2.message : 'error desconocido'), 4000);
        });
      } else if (code === 'declined') {
        showToast('Descarga cancelada.');
      } else {
        showToast('No se pudo descargar el informe: ' + (err && err.message ? err.message : 'error desconocido'), 4000);
      }
    });
  }

  function previewSheetText(text){
    var errEl = document.getElementById('sheet-error');
    if (!text || !text.trim()) {
      if (errEl) errEl.textContent = 'Subí un archivo .csv o pegá el contenido de la planilla.';
      return;

  function previewSheet(){
    var fileInput = document.getElementById('sheet-file');
    var ta = document.getElementById('sheet-text');
    if (fileInput && fileInput.files && fileInput.files[0]) {
      var reader = new FileReader();
      reader.onload = function(e){ previewSheetText(String(e.target.result || '')); };
      reader.onerror = function(){
        var errEl = document.getElementById('sheet-error');
        if (errEl) errEl.textContent = 'No se pudo leer el archivo.';
      };
      reader.readAsText(fileInput.files[0], 'utf-8');
      return;
    }
    previewSheetText(ta ? ta.value : '');
  }

  function retrySheet(){ ui.sheetImport = null; render(); }

  function confirmSheetImport(){
    var si = ui.sheetImport;
    if (!si || !si.parseResult || !si.parseResult.headerOk) return;
    var checkedDupes = {};
    document.querySelectorAll('.dupe-check:checked').forEach(function(cb){
      checkedDupes[cb.getAttribute('data-row')] = true;
    });
    var toImport = si.parseResult.rows.filter(function(r){
      if (r.errores.length) return false;
      if (r.dupe) return !!checkedDupes[String(r.rowNumber)];
      return true;
    });
    if (!toImport.length) { showToast('No hay filas para importar.'); return; }
    toImport.forEach(function(r){ state.deals.push(r.deal); });
    ui.modal = null;
    ui.sheetImport = null;
    showToast(toImport.length + ' negocio' + (toImport.length === 1 ? '' : 's') + ' importado' + (toImport.length === 1 ? '' : 's') + '.');
    persist();
  }

  function copyExportText(){
    var ta = document.getElementById('export-textarea');
    if (!ta) return;
    ta.select();
    var done = function(){ showToast('Copiado al portapapeles.'); };
    var fail = function(){ showToast('No se pudo copiar solo: el texto ya está seleccionado, usá Ctrl+C (o Cmd+C).', 4000); };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(ta.value).then(done, function(){
          try { document.execCommand('copy') ? done() : fail(); } catch(e2){ fail(); }
        });
        return;
      }
    } catch(e){}
    try { document.execCommand('copy') ? done() : fail(); } catch(e){ fail(); }
  }

  function doImport(){
    var ta = document.getElementById('import-textarea');
    var errEl = document.getElementById('import-error');
    if (!ta) return;
    var parsed;
    try {
      parsed = JSON.parse(ta.value);
    } catch(e){
      if (errEl) errEl.textContent = 'El texto pegado no es un JSON válido. Revisá que esté completo.';
      return;
    }
    if (!parsed || !Array.isArray(parsed.deals)) {
      if (errEl) errEl.textContent = 'El JSON debe tener una lista "deals". ¿Copiaste el texto completo de "Exportar"?';
      return;
    }
    var confirmMsg = 'Esto va a reemplazar los ' + state.deals.length + ' negocios actuales por los ' +
      parsed.deals.length + ' del texto importado. Esta acción no se puede deshacer. ¿Continuar?';
    if (!window.confirm(confirmMsg)) return;
    state.deals = parsed.deals;
    ui.modal = null;
    persist();
  }

  function saveDealFromForm(form){
    var fd = new FormData(form);
    var condicionesItems = [];
    form.querySelectorAll('.item-row').forEach(function(row){
      var concepto = (row.querySelector('.item-concepto').value || '').trim();
      var montoRaw = row.querySelector('.item-monto').value;
      var monto = montoRaw === '' ? '' : Number(montoRaw);
      if (concepto || montoRaw !== '') condicionesItems.push({concepto: concepto, monto: monto});
    });
    var pagoTotal = PAGO_FIELDS.reduce(function(sum, name){
      var raw = fd.get(name);
      var v = (raw === '' || raw === null) ? NaN : Number(raw);
      return sum + (isNaN(v) ? 0 : v);
    }, 0);
    var precioVal = fd.get('precio') === '' ? '' : Number(fd.get('precio'));
    var totalPago = sumItems(condicionesItems) + pagoTotal;
    var info = matchInfo(totalPago, precioVal);
    if (info.cls === 'warn') {
      var okToSave = window.confirm(
        'El subtotal de "Unidad usada en parte de pago" + "Forma de pago" + "Otros conceptos" (' + fmtNumber(totalPago) +
        ') no coincide con el precio de venta (' + fmtNumber(precioVal) + ').\n\n¿Guardar igual?'
      );
      if (!okToSave) return;
    }
    var deal = {
      id: ui.editId || uid(),
      fecha: fd.get('fecha') || todayStr(),
      vendedor: (fd.get('vendedor') || '').trim(),
      cliente: (fd.get('cliente') || '').trim(),
      unidad: (fd.get('unidad') || '').trim(),
      tipoUnidad: fd.get('tipoUnidad') || '',
      condicionUnidad: fd.get('condicionUnidad') || '',
      nis: fd.get('condicionUnidad') === '0km' ? '' : (fd.get('nis') || '').trim(),
      boletoNumero: (fd.get('boletoNumero') || '').trim(),
      boletoFecha: fd.get('boletoFecha') || '',
      precio: fd.get('precio') === '' ? '' : Number(fd.get('precio')),
      moneda: fd.get('moneda') || 'USD',
      financiacion: (fd.get('financiacion') || '').trim(),
      condicionesItems: condicionesItems,
      origen: (fd.get('origen') || '').trim(),
      tradeInModelo: (fd.get('tradeInModelo') || '').trim(),
      tradeInValor: fd.get('tradeInValor') === '' ? '' : Number(fd.get('tradeInValor')),
      pagoContado: fd.get('pagoContado') === '' ? '' : Number(fd.get('pagoContado')),
      pagoCreditoBanco: fd.get('pagoCreditoBanco') === '' ? '' : Number(fd.get('pagoCreditoBanco')),
      pagoFinancPropia1er: fd.get('pagoFinancPropia1er') === '' ? '' : Number(fd.get('pagoFinancPropia1er')),
      pagoFinancPropiaResto: fd.get('pagoFinancPropiaResto') === '' ? '' : Number(fd.get('pagoFinancPropiaResto')),
      estado: fd.get('estado') || 'en_analisis',
      notas: (fd.get('notas') || '').trim(),
      historial: []
    };
    if (ui.editId) {
      var existing = byId(ui.editId);
      deal.historial = existing ? existing.historial : [];
      if (existing && existing.estado !== deal.estado) {
        deal.historial = deal.historial.concat([{
          fecha: nowIso(), tipo: 'cambio_estado',
          texto: (STATUS[existing.estado] ? STATUS[existing.estado].label : existing.estado) + ' → ' + (STATUS[deal.estado] ? STATUS[deal.estado].label : deal.estado)
        }]);
      }
      var idx = state.deals.findIndex(function(x){ return x.id === ui.editId; });
      state.deals[idx] = deal;
    } else {
      state.deals.push(deal);
    }
    ui.modal = null; ui.editId = null;
    persist();
  }

  function deleteDeal(id){
    if (!window.confirm('¿Eliminar este negocio? Esta acción no se puede deshacer.')) return;
    state.deals = state.deals.filter(function(d){ return d.id !== id; });
    if (ui.openId === id) ui.openId = null;
    persist();
  }

  function addHist(id, form){
    var fd = new FormData(form);
    var texto = (fd.get('texto') || '').trim();
    if (!texto) return;
    var d = byId(id);
    if (!d) return;
    d.historial = (d.historial || []).concat([{ fecha: nowIso(), tipo: fd.get('tipo') || 'nota', texto: texto }]);
    persist();
  }

  function saveHistEdit(dealId, idx, newTexto){
    newTexto = (newTexto || '').trim();
    if (!newTexto) return;
    var d = byId(dealId);
    if (!d || !d.historial || !d.historial[idx]) return;
    var entry = d.historial[idx];
    if (entry.texto !== newTexto) {
      if (entry.original === undefined) entry.original = entry.texto;
      entry.texto = newTexto;
      entry.editadoFecha = nowIso();
    }
    ui.editHist = null;
    persist();
  }

  /* ---------- event wiring ----------
   * #app itself is never replaced (only its innerHTML), so delegated
   * listeners on it must be attached exactly ONCE (in init()) — attaching
   * them again on every render() would stack duplicate handlers and fire
   * each click/submit multiple times. Listeners bound directly to elements
   * that ARE recreated on every render (search box, filter selects) must
   * be re-attached each time, since those specific DOM nodes no longer
   * exist after a re-render. */
  function attachDelegatedHandlers(){
    var app = document.getElementById('app');

    app.addEventListener('click', function(e){
      var t = e.target.closest('[data-action]');
      if (!t) return;
      var action = t.getAttribute('data-action');
      var id = t.getAttribute('data-id');
      if (action === 'new') { openNew(); }
      else if (action === 'sync-now') { Sync.pull(syncApi); }
      else if (action === 'logout') {
        if (window.confirm('¿Salir de esta app en este celular? Los datos siguen guardados en la planilla.')) { Sync.logout(); location.reload(); }
      }
      else if (action === 'sort') {
        var k = t.getAttribute('data-key');
        if (ui.sortKey === k) { ui.sortDir = ui.sortDir === 'asc' ? 'desc' : 'asc'; }
        else { ui.sortKey = k; ui.sortDir = (k === 'fecha' || k === 'precio') ? 'desc' : 'asc'; }
        render();
      }
      else if (action === 'toggle') { ui.openId = (ui.openId === id) ? null : id; ui.editHist = null; render(); }
      else if (action === 'edit') { openEdit(id); }
      else if (action === 'delete') { deleteDeal(id); }
      else if (action === 'close-modal') { closeModal(); }
      else if (action === 'overlay' && !e.target.closest('[data-stop]')) { closeModal(); }
      else if (action === 'add-item') {
        var list = document.getElementById('items-list');
        if (list) { list.insertAdjacentHTML('beforeend', renderItemRow({concepto:'', monto:''})); recalcItemsSubtotal(); }
      }
      else if (action === 'remove-item') {
        var row = t.closest('.item-row');
        if (row) { row.remove(); recalcItemsSubtotal(); }
      }
      else if (action === 'export') { openExport(); }
      else if (action === 'import') { openImport(); }
      else if (action === 'copy-export') { copyExportText(); }
      else if (action === 'do-import') { doImport(); }
      else if (action === 'report') { openReport(); }
      else if (action === 'download-report') { downloadReport(); }
      else if (action === 'download-report-excel') { downloadReportExcel(); }
      else if (action === 'sheet-import') { openSheetImport(); }
      else if (action === 'download-template') { downloadTemplate(); }
      else if (action === 'preview-sheet') { previewSheet(); }
      else if (action === 'retry-sheet') { retrySheet(); }
      else if (action === 'confirm-sheet-import') { confirmSheetImport(); }
      else if (action === 'edit-hist') { ui.editHist = {dealId: id, idx: Number(t.getAttribute('data-idx'))}; render(); }
      else if (action === 'cancel-hist-edit') { ui.editHist = null; render(); }
    });

    app.addEventListener('input', function(e){
      if (e.target.classList && e.target.classList.contains('item-monto')) { recalcItemsSubtotal(); }
      else if (e.target.closest('#deal-form') && (e.target.name === 'precio' || PAGO_FIELDS.indexOf(e.target.name) !== -1)) { recalcItemsSubtotal(); }
    });

    app.addEventListener('change', function(e){
      if (e.target.name === 'condicionUnidad' && e.target.closest('#deal-form')) {
        var wrap = document.getElementById('nis-field-wrap');
        if (wrap) wrap.style.display = (e.target.value === '0km') ? 'none' : '';
        if (e.target.value === '0km') {
          var nisInput = document.querySelector('#deal-form [name="nis"]');
          if (nisInput) nisInput.value = '';
        }
      }
      else if (e.target.matches && e.target.matches('.check-group input[type="checkbox"]')) {
        var field = e.target.getAttribute('data-field');
        var val = e.target.value;
        var arr = (reportFilters[field] || []).slice();
        if (e.target.checked) { if (arr.indexOf(val) === -1) arr.push(val); }
        else { arr = arr.filter(function(x){ return x !== val; }); }
        reportFilters[field] = arr;
        render();
      }
    });

    app.addEventListener('submit', function(e){
      var form = e.target;
      var action = form.getAttribute('data-action');
      if (action === 'save-deal') { e.preventDefault(); saveDealFromForm(form); }
      else if (action === 'add-hist') {
        e.preventDefault();
        var id = form.getAttribute('data-id');
        addHist(id, form);
      }
      else if (action === 'save-hist-edit') {
        e.preventDefault();
        var histId = form.getAttribute('data-id');
        var histIdx = Number(form.getAttribute('data-idx'));
        saveHistEdit(histId, histIdx, new FormData(form).get('texto'));
      }
    });
  }

  function attachTransientHandlers(){
    var search = document.getElementById('f-search');
    if (search) search.addEventListener('input', function(e){ ui.search = e.target.value; render(); focusEl('f-search'); });
    var fv = document.getElementById('f-vendedor');
    if (fv) fv.addEventListener('change', function(e){ ui.vendedor = e.target.value; render(); });
    var fe = document.getElementById('f-estado');
    if (fe) fe.addEventListener('change', function(e){ ui.estado = e.target.value; render(); });
    var fc = document.getElementById('f-condicion');
    if (fc) fc.addEventListener('change', function(e){ ui.condicion = e.target.value; render(); });

    var repDesde = document.getElementById('rep-desde');
    if (repDesde) repDesde.addEventListener('change', function(e){ reportFilters.desde = e.target.value; render(); });
    var repHasta = document.getElementById('rep-hasta');
    if (repHasta) repHasta.addEventListener('change', function(e){ reportFilters.hasta = e.target.value; render(); });
    var repCondicion = document.getElementById('rep-condicion');
    if (repCondicion) repCondicion.addEventListener('change', function(e){ reportFilters.condicion = e.target.value; render(); });
    var repCliente = document.getElementById('rep-cliente');
    if (repCliente) repCliente.addEventListener('input', function(e){ reportFilters.cliente = e.target.value; render(); focusEl('rep-cliente'); });
  }

  function recalcItemsSubtotal(){
    var list = document.getElementById('items-list');
    var amtEl = document.getElementById('items-subtotal-amt');
    var matchEl = document.getElementById('items-match');
    if (!list || !amtEl) return;
    var sum = 0;
    list.querySelectorAll('.item-monto').forEach(function(inp){
      var v = Number(inp.value);
      if (!isNaN(v)) sum += v;
    });
    PAGO_FIELDS.forEach(function(name){
      var el = document.querySelector('#deal-form [name="' + name + '"]');
      if (el && el.value !== '') {
        var v = Number(el.value);
        if (!isNaN(v)) sum += v;
      }
    });
    amtEl.textContent = fmtNumber(sum);
    if (matchEl) {
      var precioInput = document.querySelector('#deal-form [name="precio"]');
      var info = matchInfo(sum, precioInput ? precioInput.value : '');
      matchEl.className = 'items-match ' + info.cls;
      matchEl.innerHTML = info.html;
    }
  }

  function focusEl(id){
    var el = document.getElementById(id);
    if (el) { el.focus(); var v = el.value; el.value=''; el.value=v; }
  }

  /* ---------- boot ---------- */
  function injectHeadAssets(){
    if (!document.getElementById('__fonts')) {
      var span = document.createElement('span');
      span.id = '__fonts';
      span.style.display = 'none';
      document.head.insertAdjacentHTML('beforeend', FONT_LINK_HTML);
    }
    if (!document.getElementById('__style')) {
      var styleEl = document.createElement('style');
      styleEl.id = '__style';
      styleEl.textContent = STYLE_CSS;
      document.head.appendChild(styleEl);
    }
  }

  function init(){
    injectHeadAssets();
    attachDelegatedHandlers();
    render();
    downloadsNs = {
      save: function(o){
        return new Promise(function(resolve, reject){
          try {
            var type = /\.csv$/i.test(o.filename) ? 'text/csv;charset=utf-8' : (/\.html$/i.test(o.filename) ? 'text/html;charset=utf-8' : 'text/plain;charset=utf-8');
            var blob = new Blob(['﻿', o.data], {type: type});
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url; a.download = o.filename; document.body.appendChild(a); a.click();
            setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 1500);
            resolve();
          } catch(e){ reject(e); }
        });
      }
    };
    Sync.onStatus(updateSyncChip);
    updateSyncChip();
    Sync.pull(syncApi);
    document.addEventListener('visibilitychange', function(){ if (!document.hidden) Sync.pull(syncApi); });
    window.addEventListener('online', function(){ Sync.pull(syncApi); });
    setInterval(function(){ if (!document.hidden) Sync.pull(syncApi); }, 60000);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

}
</script>
<script>
(function(){
  var appEl = document.getElementById('app');
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  function start(deals){
    window.__STATE__ = {deals: deals};
    appMain();
  }

  function showLogin(msg){
    var needUrl = !(window.AGT_CONFIG && /^https:\/\/script\.google\.com\//.test(window.AGT_CONFIG.apiUrl || ''));
    appEl.innerHTML =
      '<form class="agt-login" id="agt-form">' +
        '<h1>Negocios · Agroterra</h1>' +
        '<p>Ingresá la clave del equipo para conectar con la planilla.</p>' +
        (needUrl ? '<label>Dirección del script (URL de Apps Script)</label><input id="agt-url" type="url" placeholder="https://script.google.com/macros/s/…/exec" value="' + esc(Sync.apiUrl()) + '">' : '') +
        '<label>Clave del equipo</label><input id="agt-key" type="password" autocomplete="current-password">' +
        '<button type="submit">Entrar</button>' +
        '<div class="err" id="agt-err">' + esc(msg || '') + '</div>' +
      '</form>';
    document.getElementById('agt-form').addEventListener('submit', function(ev){
      ev.preventDefault();
      var key = document.getElementById('agt-key').value.trim();
      var urlEl = document.getElementById('agt-url');
      var url = urlEl ? urlEl.value.trim() : '';
      var err = document.getElementById('agt-err');
      if (!key) { err.textContent = 'Ingresá la clave.'; return; }
      Sync.setCredentials(url, key);
      if (!Sync.apiUrl()) { err.textContent = 'Falta la dirección del script.'; return; }
      err.textContent = 'Conectando…';
      Sync.initialFetch().then(function(list){ start(list); }).catch(function(e){
        err.textContent = (e && e.auth) ? 'Clave incorrecta.' : 'No se pudo conectar con la planilla. Revisá la conexión y la dirección del script.';
      });
    });
  }

  function boot(){
    if (!Sync.configured()) { showLogin(); return; }
    Sync.loadBase();
    var cache = Sync.cached();
    var hasBase = false; try { hasBase = Object.keys(JSON.parse(localStorage.getItem('agt_base') || '{}')).length > 0 || (cache && cache.length === 0); } catch(e){}
    if (cache && hasBase) { start(cache); return; }
    Sync.initialFetch().then(start).catch(function(e){
      if (e && e.auth) showLogin('Clave incorrecta.');
      else appEl.innerHTML = '<p style="font-family:system-ui;padding:2rem;color:#6E6656;">Sin conexión y sin datos guardados en este celular. Conectate a internet y volvé a abrir la app.</p>';
    });
  }

  if ('serviceWorker' in navigator) { window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
  boot();
})();
</script>
